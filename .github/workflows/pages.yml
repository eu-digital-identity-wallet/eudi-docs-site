# Deploy the EUDI Reference Implementation MkDocs site to GitHub Pages.
# Mirrors the ARF canonical pages workflow
# (eudi-doc-architecture-and-reference-framework/.github/workflows/pages.yml),
# adapted: this repo has no release tags, so the site is published under the
# single `latest` alias instead of a tag-derived version number.
name: Deploy to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Allows other repositories to trigger a rebuild (e.g. on content updates)
  repository_dispatch:
    types: [trigger-build]

# Least-privilege default; the deploy job opts into what it needs.
permissions:
  contents: read

# Publishing must not be interrupted mid-push, or the gh-pages branch can be
# left in an inconsistent state. Queue concurrent runs instead of cancelling.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # mike pushes the built site to the gh-pages branch.
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history required by mike

      - name: Setup python environment
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.x
          cache: pip

      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - name: Setup mkdocs-material cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install mkdocs theme
        run: pip install -r requirements.txt

      - name: Configure git author for mike
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # No release tags in this repo: publish a single version aliased `latest`
      # and make it the default, so `/` redirects to `/latest/`.
      - name: Deploy mkdocs
        run: |
          mike deploy --push --update-aliases latest
          mike set-default --allow-empty --push latest
